services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bis
      POSTGRES_PASSWORD: bis
      POSTGRES_DB: bis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bis -d bis"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: ./ai-service
    environment:
      DATABASE_URL: postgresql://bis:bis@postgres:5432/bis
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  api:
    build: ./node-api
    environment:
      DATABASE_URL: postgresql://bis:bis@postgres:5432/bis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
